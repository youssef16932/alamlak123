margin:0;
padding:0;

}

html{
scroll-behavior:smooth;
}

body{
background:#f4f5f7;
color:#111;

}

body.dark{
background:#111;

/* =========================================================
   HEADER

========================================================= */

header{
position:relative;
z-index:5000;
background:#111;
color:#fff;

}

max-width:1200px;
margin:auto;
height:55px;

grid-template-columns:1fr auto 1fr;
align-items:center;
}

border:0;
background:#e21d25;
color:#fff;
width:45px;
height:45px;
border-radius:10px;

}

.logo{
font-size:34px;
font-weight:900;
text-align:center;
}

.logo span{
color:#e21d25;
}

/* =========================================================
   SIDE MENU
========================================================= */

.side-menu{
position:fixed;
top:0;
right:-330px;
width:310px;
max-width:85%;
height:100vh;
background:#fff;
color:#111;
z-index:20000;
box-shadow:-5px 0 25px rgba(0,0,0,.3);
padding:20px;
transition:.3s;
overflow-y:auto;
}

body.dark .side-menu{
background:#1d1d1d;
color:#fff;
}

.side-menu.open{

.menu-header{
display:flex;
align-items:center;
justify-content:space-between;

background:#eee;
width:40px;
height:40px;
border-radius:50%;

}

.menu-item{
width:100%;
border:0;
padding:14px;
margin-bottom:10px;
border-radius:10px;
background:#f1f1f1;
font-weight:bold;
text-align:right;
font-size:15px;
}

body.dark .menu-item{
background:#2b2b2b;
color:#fff;
}

.menu-item.red{
background:#e21d25;
color:#fff;
}

.menu-user{

body.dark .menu-user{

.menu-overlay{

}

========================================================= */

color:#111;

========================================================= */

.categories{

z-index:100;
background:#f4f5f7;
padding:12px 0;

body.dark .categories{

.category-list{

gap:10px;
overflow-x:auto;
scrollbar-width:none;

.category-list::-webkit-scrollbar{

.category{

background:#fff;
padding:12px 23px;
border-radius:50px;
white-space:nowrap;

body.dark .category{
background:#222;
color:#fff;
border-color:#444;
}

.category.active{
background:#e21d25;
color:#fff;

}

/* =========================================================
   SUBCATEGORIES
========================================================= */

.subcategories{
display:none;
margin-top:7px;
background:#fff;
padding:12px;
border-radius:15px;
box-shadow:0 3px 15px rgba(0,0,0,.07);
}

body.dark .subcategories{
background:#1e1e1e;
}

.subcategories.show{
display:block;
}

.sub-title{
font-size:14px;
color:#777;
margin-bottom:10px;
}

.sub-list{
display:flex;
gap:9px;
overflow-x:auto;
scrollbar-width:none;
}

.sub-btn{
border:1px solid #ddd;
background:#fafafa;
padding:10px 18px;
border-radius:10px;
white-space:nowrap;
font-weight:bold;
flex-shrink:0;
}

body.dark .sub-btn{
background:#292929;
color:#fff;
border-color:#444;
}

.sub-btn.active{

color:#fff;

/* =========================================================
   TITLE
========================================================= */

.title{
margin:20px 0 15px;

body.dark .product{
background:#1e1e1e;

.product-image{
height:210px;
background:#e9ebee;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:#777;
overflow:hidden;

.product-image img{
width:100%;
height:100%;

.product-info{
padding:14px;

.product-info h3{
font-size:18px;

gap:7px;

font-weight:bold;

.details-btn{
background:#111;
color:#fff;
}

.add-cart-btn{
background:#e21d25;
color:#fff;

align-items:center;

.detail-content h1{
font-size:34px;

.detail-content small{
color:#888;

.detail-content h3{
margin-top:20px;
margin-bottom:6px;

.detail-content p{
color:#555;

body.dark .detail-content p{

.form-group{

.form-group label{

body.dark .form-group input,

.primary-btn,
.secondary-btn{
border:0;
border-radius:9px;
padding:13px 20px;
font-weight:bold;
}

.primary-btn{
background:#e21d25;
color:#fff;
}

.secondary-btn{
background:#111;
color:#fff;
}

/* =========================================================
   MODAL
========================================================= */

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.65);
z-index:99999;
display:none;
align-items:center;
justify-content:center;
padding:15px;
}

.modal.show{
display:flex;
}

.modal-box{
width:100%;
max-width:500px;
background:#fff;
color:#111;
border-radius:18px;
padding:25px;
max-height:90vh;
overflow:auto;
}

body.dark .modal-box{
background:#1e1e1e;
color:#fff;
}

.modal-close{
float:left;
border:0;
background:#eee;
width:35px;
height:35px;
border-radius:50%;
font-size:20px;
}

.modal-title{
font-size:25px;
margin-bottom:18px;
}

.form-message{
display:none;
padding:10px;
border-radius:8px;
margin:10px 0;
}

.form-message.error{
display:block;
background:#ffe4e4;
color:#a00000;
}

.form-message.success{
display:block;
background:#e1f8e9;
color:#087b35;
}

/* =========================================================
   EMPTY / LOADING
========================================================= */

.empty,
.no-results{
text-align:center;
padding:50px 15px;
color:#777;
}

.no-results-icon{
font-size:50px;
margin-bottom:15px;
}

.loading{
grid-column:1/-1;
text-align:center;
padding:60px 15px;
color:#777;
font-size:18px;
}

/* =========================================================
   FOOTER
========================================================= */

footer{
margin-top:50px;
background:#111;
color:#fff;
padding:35px 15px;
}

.footer-content{
max-width:1200px;
margin:auto;
}

.footer-content p{
color:#aaa;
margin-top:7px;
}

/* =========================================================
   TOAST
========================================================= */

.toast{
position:fixed;
bottom:20px;
right:20px;
background:#111;
color:#fff;
padding:14px 18px;
border-radius:10px;
z-index:100000;
display:none;
}

.toast.show{
display:block;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:900px){

.products{

@media(max-width:600px){

width:42px;

.search{
height:48px;

.search button{
padding:0 15px;
}

.products{
gap:10px;
}

.product-image{
height:160px;

.product-info{
padding:10px;

.product-info h3{
font-size:15px;
}

.price{
font-size:18px;

.product-buttons{
flex-direction:column;

.detail-image{
min-height:280px;

.detail-content h1{

.cart-item{
grid-template-columns:70px 1fr;
}

.cart-actions{
grid-column:1/-1;
}

.cart-item-image{
width:70px;
height:70px;
}

}

img,
video,
iframe{
max-width:100%;
}

</style>

</head>

/* =========================================================
   NORMALIZE
========================================================= */

function normalize(text){

return String(text||"")
.toLowerCase()
.replace(/[أإآ]/g,"ا")
.replace(/ى/g,"ي")
.replace(/ة/g,"ه")
.replace(/ؤ/g,"و")
.replace(/ئ/g,"ي")
.replace(/[\u064B-\u065F\u0670]/g,"")
.replace(/ـ/g,"")
.trim();

}


/* =========================================================
   LEVENSHTEIN
========================================================= */

function levenshtein(a,b){

const matrix=[];

for(let i=0;i<=a.length;i++)
matrix[i]=[i];

for(let j=0;j<=b.length;j++)
matrix[0][j]=j;

for(let i=1;i<=a.length;i++){

for(let j=1;j<=b.length;j++){

matrix[i][j]=
a[i-1]===b[j-1]
?
matrix[i-1][j-1]
:
Math.min(
matrix[i-1][j]+1,
matrix[i][j-1]+1,
matrix[i-1][j-1]+1
);

}

}

return matrix[a.length][b.length];

}


/* =========================================================
   SMART SEARCH
========================================================= */

function smartSearch(product,q){

q=normalize(q);

if(!q)
return true;

const text=normalize([

product.name,
product.mainCategory,
product.subCategory,
product.description,
product.includes,
product.stock

].join(" "));

if(text.includes(q))
return true;

return q.split(/\s+/).every(word=>{

return text.split(/\s+/).some(textWord=>{

if(!textWord)
return false;

const max=Math.max(
word.length,
textWord.length
);

if(max===0)
return true;

const distance=
levenshtein(word,textWord);

const similarity=
(max-distance)/max;

return similarity >=
(word.length<=3?.55:.48);

});

});

}

);

);

clearAuthMessage();

const firstName=
document.getElementById(
"registerFirstName"
).value.trim();

const lastName=
document.getElementById(
"registerLastName"
).value.trim();

const phone=
document.getElementById(
"registerPhone"
).value.trim();

const address=
document.getElementById(
"registerAddress"
).value.trim();

const email=
document.getElementById(
"registerEmail"
).value.trim();

const password=
document.getElementById(
"registerPassword"
).value;

if(
!firstName||
!lastName||
!phone||
!address||
!email||
!password
){

showAuthMessage(
"من فضلك املأ كل البيانات."
);

return;

}

if(password.length<6){

showAuthMessage(
"كلمة المرور لازم تكون 6 أحرف على الأقل."
);

return;

}

try{

const {
data,
error
}=
await db.auth.signUp({

email:email,

password:password,

options:{

data:{

first_name:firstName,

last_name:lastName,

phone:phone,

address:address

}

}

});

if(error)
throw error;

if(!data.user){

throw new Error(
"تعذر إنشاء الحساب."
);

}

if(data.session){

await db.auth.signOut();

showAuthMessage(
"تم إنشاء الحساب بنجاح ✅ دلوقتي سجل دخول.",
"success"
);

setTimeout(
()=>{

showLoginForm();

document.getElementById(
"loginEmail"
).value=email;

document.getElementById(
"loginPassword"
).value="";

},
800
);

}else{

showAuthMessage(
"تم إنشاء الحساب. لو تأكيد الإيميل مفعل عندك، أكد الإيميل أولاً ثم سجل الدخول.",
"success"
);

setTimeout(
()=>{

showLoginForm();

document.getElementById(
"loginEmail"
).value=email;

},
1000
);

}

}catch(error){

console.error(
"REGISTER ERROR:",
error
);

let message=
"حصل خطأ أثناء إنشاء الحساب.";

const msg=
(error.message||"")
.toLowerCase();

if(
msg.includes("already registered")||
msg.includes("already exists")||
msg.includes("user already registered")
){

message=
"الإيميل ده مستخدم بالفعل.";

}

else if(
msg.includes("password")
){

message=
"كلمة المرور ضعيفة أو غير صحيحة.";

}

else if(
msg.includes("invalid email")
){

message=
"اكتب بريد إلكتروني صحيح.";

}

showAuthMessage(
message
);

}

};


/* =========================================================
   LOGIN
========================================================= */

window.loginUser=
async function(){

clearAuthMessage();

const email=
document.getElementById(
"loginEmail"
).value.trim();

const password=
document.getElementById(
"loginPassword"
).value;

if(!email||!password){

showAuthMessage(
"اكتب الإيميل وكلمة المرور."
);

return;

}

try{

const {
data,
error
}=
await db.auth.signInWithPassword({

email:email,

password:password

});

if(error)
throw error;

if(!data.user){

throw new Error(
"تعذر تسجيل الدخول."
);

}

currentUser=
data.user;

updateHeader();

showAuthMessage(
"تم تسجيل الدخول بنجاح ✅",
"success"
);

setTimeout(
()=>{

closeAuthModal();

updateMenu();

},
500
);

}catch(error){

console.error(
"LOGIN ERROR:",
error
);

let message=
"الإيميل أو كلمة المرور غير صحيحة.";

const msg=
(error.message||"")
.toLowerCase();

if(
msg.includes("email not confirmed")
){

message=
"لازم تأكد الإيميل الأول من رسالة Supabase.";

}

if(
msg.includes("invalid login credentials")
){

message=
"الإيميل أو كلمة المرور غير صحيحة.";

}

showAuthMessage(
message
);

}

};


/* =========================================================
   LOGOUT
========================================================= */

window.logoutUser=
async function(){

try{

const {
error
}=
await db.auth.signOut();

if(error)
throw error;

currentUser=null;

updateMenu();

closeMenu();

showCatalog();

showToast(
"تم تسجيل الخروج 👋"
);

}catch(error){

console.error(error);

}

};


/* =========================================================
   AUTH STATE
========================================================= */

db.auth.onAuthStateChange(
(event,session)=>{

currentUser=
session?.user||null;

updateMenu();

}
);


/* =========================================================
   USER NAME
========================================================= */

function getUserFullName(){

if(!currentUser)
return "";

const meta=
currentUser.user_metadata||{};

return (
(meta.first_name||"")+" "+
(meta.last_name||"")
).trim();

}


/* =========================================================
   HEADER
========================================================= */

function updateHeader(){

updateMenu();

}


/* =========================================================
   MENU
========================================================= */

function toggleMenu(){

document
.getElementById("sideMenu")
.classList.toggle("open");

document
.getElementById("menuOverlay")
.classList.toggle("show");

updateMenu();

}

window.toggleMenu=toggleMenu;


function closeMenu(){

document
.getElementById("sideMenu")
.classList.remove("open");

document
.getElementById("menuOverlay")
.classList.remove("show");

}

window.closeMenu=closeMenu;


/* =========================================================
   UPDATE MENU
========================================================= */

function updateMenu(){

const box=
document.getElementById(
"menuContent"
);

if(!box)
return;

if(!currentUser){

box.innerHTML=`

<button
class="menu-item red"
onclick="openAuthModal()">

🔐 تسجيل الدخول

</button>

<button
class="menu-item"
onclick="openAuthFromMenu()">

📝 إنشاء حساب

</button>

`;

}else{

const name=
getUserFullName()||
"العميل";

box.innerHTML=`

<div class="menu-user">

👋 أهلاً يا
<strong>
${escapeHTML(name)}
</strong>

</div>

<button
class="menu-item red"
onclick="openCart()">

🛒 السلة
(
<span id="menuCartCount">
${getCart().reduce(
(a,b)=>a+b.quantity,0
)}
</span>
)

</button>

<button
class="menu-item"
onclick="toggleTheme()">

🌙 / ☀️ الوضع الليلي والصباحي

</button>

<button
class="menu-item"
onclick="logoutUser()">

🚪 تسجيل الخروج

</button>

`;

}

}

window.openAuthFromMenu=
function(){

showRegisterForm();

openAuthModal();

};


/* =========================================================
   THEME
========================================================= */

function applyTheme(){

const theme=
localStorage.getItem(
"el3mlaaq_theme"
)||"light";

if(theme==="dark"){

document.body.classList.add("dark");

}else{

document.body.classList.remove("dark");

}

}


window.toggleTheme=
function(){

const isDark=
document.body.classList.contains(
"dark"
);

if(isDark){

document.body.classList.remove(
"dark"
);

localStorage.setItem(
"el3mlaaq_theme",
"light"
);

showToast(
"تم تشغيل الوضع الصباحي ☀️"
);

}else{

document.body.classList.add(
"dark"
);

localStorage.setItem(
"el3mlaaq_theme",
"dark"
);

showToast(
"تم تشغيل الوضع الليلي 🌙"
);

}

updateMenu();

};

applyTheme();


/* =========================================================
   SEARCH EVENTS
========================================================= */

document
.getElementById("search")
.addEventListener(
"input",
function(){

renderProducts();

renderSuggestions();

}
);


document.addEventListener(
"click",
function(event){

const search=
document.querySelector(
".search"
);

if(
search &&
!search.contains(
event.target
)
){

document
.getElementById(
"searchSuggestions"
)
.classList.remove(
"show"
);

}

});


/* =========================================================
   ESC KEY
========================================================= */

document.addEventListener(
"keydown",
function(event){

if(event.key==="Escape"){

closeMenu();

document
.getElementById("authModal")
.classList.remove("show");

document
.getElementById("checkoutModal")
.classList.remove("show");

}

});


/* =========================================================
   TOAST
========================================================= */

function showToast(message){

const toast=
document.getElementById(
"toast"
);

toast.textContent=message;

toast.classList.add("show");

clearTimeout(
window.toastTimer
);

window.toastTimer=
setTimeout(
()=>toast.classList.remove("show"),
2500
);

}


/* =========================================================
   START
========================================================= */

updateCartCount();

updateMenu();

applyTheme();

loadProducts();

subscribeToProducts();

</script>
